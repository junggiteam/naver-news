name: Master Scheduler

on:
  schedule:
    # GitHub 자체 schedule은 public 저장소에서 best-effort라 3~10시간
    # 간격으로 불규칙 발동됨(2026-07-24~27 실측). 완전히 없애지는 않고
    # 최후의 안전망으로만 남겨둔다. 실제 정시 실행은 아래 repository_dispatch가 담당.
    - cron: '3,13,23,33,43,53 * * * *'
  repository_dispatch:
    # 외부 크론 서비스(cron-job.org)가 정확한 시각에 GitHub API로
    # 이 이벤트를 호출해서 깨운다. GitHub 자체 스케줄러보다 훨씬 정시성이 높음.
    types: [wake-up]
  workflow_dispatch: # 필요할 때 깃허브 웹에서 수동 실행 가능

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 스케줄된 크롤러 실행 (목표 시각 판단 후 필요한 것만 실행)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: python run_scheduled.py

      # 임시 검증 스텝 - "역대/최고" 등 과장 표현 금지 지침 반영 확인용.
      # 확인 끝나면 스텝/파일 모두 제거.
      - name: (임시) 과장 표현 금지 재검증
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python _verify_market_report.py

      - name: 깃허브에 데이터 저장 (Push, 충돌 시 재시도)
        run: |
          git config --local user.email "junggiteam@gmail.com"
          git config --local user.name "junggiteam"
          git add data/

          if git diff --staged --quiet; then
            echo "변경사항 없음 - 종료"
            exit 0
          fi
          git commit -m "Auto update: Scheduled crawler run (master_scheduler)"

          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main; then
              if git push origin main; then
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "push 충돌(동시 실행) - ${i}번째 재시도 대기 중..."
            sleep $((RANDOM % 20 + 5))
          done
          echo "5회 재시도 후에도 push 실패"
          exit 1
