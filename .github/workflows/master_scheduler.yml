name: Master Scheduler

on:
  schedule:
    # GitHub 자체 schedule은 public 저장소에서 best-effort라 3~10시간
    # 간격으로 불규칙 발동됨(2026-07-24~27 실측). 완전히 없애지는 않고
    # 최후의 안전망으로만 남겨둔다. 실제 정시 실행은 아래 repository_dispatch가 담당.
    - cron: '3,13,23,33,43,53 * * * *'
  repository_dispatch:
    # 외부 크론 서비스(cron-job.org)가 정확한 시각에 GitHub API로
    # 이 이벤트를 호출해서 깨운다. GitHub 자체 스케줄러보다 훨씬 정시성이 높음.
    types: [wake-up]
  workflow_dispatch: # 필요할 때 깃허브 웹에서 수동 실행 가능

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 스케줄된 크롤러 실행 (목표 시각 판단 후 필요한 것만 실행)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_scheduled.py

      - name: 깃허브에 데이터 저장 (Push)
        run: |
          git config --local user.email "junggiteam@gmail.com"
          git config --local user.name "junggiteam"
          git add data/

          git diff --staged --quiet || git commit -m "Auto update: Scheduled crawler run (master_scheduler)"

          git pull --rebase origin main
          git push origin main
