<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중기이코노미 쏘왓레터 구독</title>
<meta name="robots" content="noindex">
<style>
:root{--brand:#e20e0e;color-scheme:light;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:#242424;background:#fff}
#stb_form_submit_button > span{display:inline-block;transform:translateX(0)}
#stb_form_submit_button:not(:disabled):not(.disabled):is(:hover,:focus-visible) > span{animation:sowhat-arrow-sway .8s ease-in-out infinite alternate}
@keyframes sowhat-arrow-sway{from{transform:translateX(0)}to{transform:translateX(6px)}}
#stb_subscribe .consent-row input[type="checkbox"]{appearance:none;-webkit-appearance:none;display:grid;place-content:center;border:1px solid #888;border-radius:2px;background:#fff;box-shadow:none;cursor:pointer;flex:none}
#stb_subscribe .consent-row input[type="checkbox"]:is(:hover,:active){border-color:#888;background:#fff}
#stb_subscribe .consent-row input[type="checkbox"]:checked,#stb_subscribe .consent-row input[type="checkbox"]:checked:is(:hover,:active,:focus){border-color:var(--brand);background:var(--brand)}
#stb_subscribe .consent-row input[type="checkbox"]:checked::after{content:"";display:block;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
@media(prefers-reduced-motion:reduce){#stb_form_submit_button > span{animation:none!important}}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-width:280px;height:288px}body{font-size:13px;padding:4px 0 6px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #e20e0e;outline-offset:2px}
#stb_subscribe{position:relative;width:100%;height:100%;border:1px solid #e4e4e4;border-radius:4px;padding:15px 16px;background:#fdfdfd;box-shadow:none}
.stb_form{height:100%;display:flex;flex-direction:column;gap:12px}h1,h2,p,fieldset{margin:0;padding:0;border:0;min-width:0}h1.stb_form_title{font-size:23px;line-height:29px;letter-spacing:-1px;color:var(--brand);font-weight:750}.description{font-size:12px;line-height:18px;margin-top:3px;color:#5e5e5e;letter-spacing:-.3px}.fields{display:grid;gap:8px}.stb_form_set{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:7px}.stb_form_set label{font-size:12px;line-height:18px}.required{color:var(--brand);margin-left:2px}.stb_form_set_input{min-width:0;width:100%;height:36px;border:1px solid #bdbdbd;border-radius:2px;background:#fff;padding:0 9px;font-size:13px;color:#242424}.stb_form_set_input::placeholder{color:#777}.consents{display:grid;gap:5px}.consent-row{display:flex;align-items:center;gap:4px;min-height:18px;white-space:nowrap;font-size:12px;letter-spacing:-.45px}.consent-row input{margin:0 2px 0 0;width:15px;height:15px;accent-color:var(--brand)}.consent-row label{cursor:pointer}.policy-link{padding:0;border:0;background:none;color:#444;text-decoration:underline;text-underline-offset:3px;font-size:12px;letter-spacing:-.45px;line-height:18px}.stb_form_set_submit{margin-top:auto}#stb_form_submit_button{width:100%;height:39px;border:0;border-radius:2px;background:var(--brand);color:white;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;padding:0 13px}#stb_form_submit_button:hover{background:var(--brand)}#stb_form_submit_button:disabled,#stb_form_submit_button.disabled{opacity:.55;cursor:wait;pointer-events:none}.stb_form_msg_error,.stb_form_result{display:none!important}.notice{position:absolute;inset:0;background:#fff;z-index:3;padding:24px 18px;display:flex;flex-direction:column;justify-content:center;gap:16px;overflow:auto}.notice[hidden]{display:none}.notice p{font-size:14px;line-height:1.65;overflow-wrap:anywhere}.notice button,dialog button{border:0;border-radius:2px;background:var(--brand);color:#fff;padding:9px 18px;font-weight:700}dialog{width:calc(100% - 24px);max-height:calc(100% - 24px);margin:auto;padding:17px;border:1px solid #ddd;border-radius:3px;color:#242424;background:#fff;overflow:auto}dialog::backdrop{background:#0007}dialog h2{font-size:17px;line-height:1.4;margin-bottom:12px;color:var(--brand)}dialog p{font-size:13px;line-height:1.65;margin-bottom:15px}dialog form{text-align:right}noscript{position:absolute;inset:0;background:#fff;padding:25px;z-index:5}

</style>
</head>
<body>
<main id="stb_subscribe">
<form action="https://stibee.com/api/v1.0/lists/MellpYd8iYx3El4QPLklGfJyfOaSJA==/public/subscribers" method="POST" target="_blank" accept-charset="utf-8" class="stb_form" name="stb_subscribe_form" id="stb_subscribe_form" data-lang="" novalidate>
<header><h1 class="stb_form_title">쏘왓레터 구독하기</h1><p class="description">경제 뉴스, 경영에 필요한 결론만 받아보세요.</p></header>
<div class="fields">
<fieldset class="stb_form_set"><label for="stb_email">이메일<span class="required">*</span></label><input type="email" class="stb_form_set_input" id="stb_email" name="email" required autocomplete="email" placeholder="이메일 주소"><div class="stb_form_msg_error" id="stb_email_error"></div></fieldset>
<fieldset class="stb_form_set"><label for="stb_name">이름<span class="required">*</span></label><input type="text" class="stb_form_set_input" id="stb_name" name="name" required autocomplete="name" placeholder="이름"><div class="stb_form_msg_error" id="stb_name_error"></div></fieldset>
</div>
<div hidden><select id="stb_referer" name="referer" required aria-label="구독 경로"><option selected value="기타 ">기타 </option></select><div id="stb_referer_error" class="stb_form_msg_error"></div><input type="hidden" id="stb_referer2" name="referer2" value="중기이코노미 홈페이지 우측 구독폼"><input type="hidden" id="stb_company" name="company" value=""></div>
<div class="consents">
<div class="stb_form_policy"><div class="consent-row"><input type="checkbox" id="stb_policy" value="stb_policy_true" aria-required="true" aria-label="필수 개인정보 수집 및 이용 동의"><label for="stb_policy">(필수)</label><button data-modal="privacy-dialog" class="policy-link" type="button">개인정보 수집·이용 동의</button></div><div class="stb_form_msg_error" id="stb_policy_error"></div></div>
<div class="stb_form_policy"><div class="consent-row"><input type="checkbox" id="stb_ad_agreement" value="stb_ad_agreement_true" aria-label="선택 광고성 정보 수신 동의"><label for="stb_ad_agreement">(선택)</label><button data-modal="marketing-dialog" class="policy-link" type="button">광고성 정보 수신 동의</button></div><div class="stb_form_msg_error" id="stb_ad_agreement_error"></div></div>
</div>
<div class="stb_form_result" id="stb_form_result" role="status" aria-live="polite"></div>
<fieldset class="stb_form_set_submit"><button type="submit" class="stb_form_submit_button" id="stb_form_submit_button" disabled>뉴스레터 구독하기 <span aria-hidden="true">→</span></button></fieldset>
</form>
<div class="notice" id="notice" role="alert" hidden><p id="notice-text"></p><button type="button" id="notice-close">확인</button><a id="notice-link" href="https://page.stibee.com/archives/479387" target="_blank" rel="noopener" style="color:#e20e0e;font-size:12px">쏘왓레터 모아보기 →</a></div>
<dialog id="privacy-dialog" aria-labelledby="privacy-title"><h2 id="privacy-title">개인정보 수집 및 이용</h2><p>뉴스레터 발송을 위한 최소한의 개인정보를 수집하고 이용합니다.<br>수집된 정보는 발송 외 다른 목적으로 이용되지 않으며, 서비스가 종료되거나 구독을 해지할 경우 즉시 파기됩니다.</p><form method="dialog"><button>닫기</button></form></dialog>
<dialog id="marketing-dialog" aria-labelledby="marketing-title"><h2 id="marketing-title">광고성 정보 수신</h2><p>제휴 콘텐츠, 프로모션, 이벤트 정보 등의 광고성 정보를 수신합니다.</p><form method="dialog"><button>닫기</button></form></dialog>
<noscript><a href="https://page.stibee.com/subscriptions/479387" target="_blank" rel="noopener">스티비에서 구독 신청하기</a></noscript>
</main>
<script>
(() => {
  'use strict';
  const form = document.getElementById('stb_subscribe_form');
  const submit = document.getElementById('stb_form_submit_button');
  const notice = document.getElementById('notice');
  let focusReturn;
  function message(text) {
    focusReturn = document.activeElement;
    document.getElementById('notice-text').textContent = text;
    const link = document.getElementById('notice-link');
    link.href = 'https://page.stibee.com/archives/479387';
    link.textContent = '쏘왓레터 모아보기 →';
    notice.hidden = false;
    document.getElementById('notice-close').focus();
  }
  document.getElementById('notice-close').addEventListener('click', () => {notice.hidden = true; focusReturn?.focus();});
  document.querySelectorAll('[data-modal]').forEach(button => button.addEventListener('click', () => document.getElementById(button.dataset.modal).showModal()));
  form.addEventListener('submit', event => {
    if (!window.STBSUBFORM) {event.preventDefault();event.stopImmediatePropagation();message('구독폼을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.');}
  });
  const script = document.createElement('script');
  script.src = 'https://resource.stibee.com/subscribe/stb_subscribe_form.js';
  script.onerror = () => {message('구독폼 연결에 실패했습니다. 잠시 후 새로고침하거나 스티비 구독 페이지를 이용해 주세요.');};
  script.onload = () => {
    const api = window.STBSUBFORM;
    if (!api) return script.onerror();
    // Keep Stibee's official validation and serialization, including marketing consent.
    api.showError = () => (id, text) => { message(text); focusReturn = document.getElementById(id) || submit; };
    api.xhrRequest = (endpoint, payload) => {
      api.submitButton = submit;
      submit.disabled = true;
      const xhr = new XMLHttpRequest();
      xhr.open('POST', endpoint, true);
      xhr.timeout = 20000;
      xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      const done = text => {submit.disabled = false;message(text);};
      xhr.onload = () => {
        if (xhr.status !== 200) return done('신청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.');
        const response = xhr.responseText;
        let content;
        if (response.includes('@ERROR_MSG')) content = response.split('ERROR_MSG:')[1]?.split('-->')[0];
        else content = new DOMParser().parseFromString(response, 'text/html').querySelector('.msg')?.textContent;
        done(content?.trim() || '처리 결과를 확인하지 못했습니다. 스티비 구독 페이지에서 확인해 주세요.');
      };
      xhr.onerror = () => done('네트워크 연결을 확인한 뒤 다시 시도해 주세요.');
      xhr.ontimeout = () => done('응답이 지연되고 있습니다. 잠시 후 다시 시도해 주세요.');
      xhr.send(payload);
    };
    submit.disabled = false;
  };
  document.body.appendChild(script);
})();

</script>
</body></html>
