<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DART 공시 (모바일)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
</style>
</head>
<body>

<div id="mt-strip-h">
  <div class="mth-header">
    <span class="mth-label">DART 공시</span>
  </div>

  <div class="mth-viewport">
    <div class="mth-track" id="mth-track">
      <span class="mth-loading">불러오는 중...</span>
    </div>
  </div>

  <div class="mth-meta">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <span id="mth-meta-text"></span>
  </div>
</div>

<style>
  #mt-strip-h {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 14px 18px 12px;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    font-family: "Noto Sans KR", "Malgun Gothic", -apple-system, sans-serif;
    box-sizing: border-box;
    background: #fff;
  }
  #mt-strip-h * { box-sizing: border-box; }

  .mth-header {
    margin: -14px -18px 10px -18px;
    padding: 10px 18px;
    background: #397fe7;
    border-radius: 10px 10px 0 0;
  }
  .mth-label {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }

  /* 가로로 흐르는 티커 영역 */
  .mth-viewport {
    overflow: hidden;
    white-space: nowrap;
  }

  /* index-ticker-mobile.html과 달리 탭-정지 토글이 없다 - 각 항목이
     DART 원문으로 이동하는 링크라, 탭했을 때 "이동"과 "멈춤"이 동시에
     기대되면 혼란스럽다(링크인 줄 알고 탭했는데 안 움직이고 멈추기만
     하면 오작동처럼 보임). 그래서 애니메이션은 멈추지 않고 계속 흐르게
     두고, 항목을 정확히 탭하면 바로 그 공시로 이동한다. */
  .mth-track {
    display: inline-flex;
    align-items: center;
    animation: mth-scroll-left linear infinite;
  }

  @keyframes mth-scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .mth-loading { font-size: 13px; color: #aaa; }

  .mth-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 18px;
    border-right: 1px solid #eee;
    white-space: nowrap;
    color: inherit;
    text-decoration: none;
  }
  .mth-item:last-child { border-right: none; }
  .mth-item:hover .mth-name { color: #142c67; }

  /* 뱃지 색상은 ma-ticker.html(PC)의 카테고리 색상을 그대로 재사용 */
  .mth-badge {
    flex: 0 0 auto;
    padding: 2px 7px;
    border-radius: 999px;
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    white-space: nowrap;
  }
  .mth-badge.cat-merge { background: #8B5CF6; }
  .mth-badge.cat-equity { background: #3182F6; }
  .mth-badge.cat-swap { background: #0EA5A5; }
  .mth-badge.cat-control { background: #E9435C; }
  .mth-badge.cat-treasury { background: #F5A623; }

  .mth-name {
    font-size: 13.5px;
    font-weight: 700;
    color: #222;
  }

  .mth-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #eee;
    font-size: 11px;
    color: #aaa;
  }
</style>

<script>
(function () {
  var DART_MA_URL = "https://raw.githubusercontent.com/junggiteam/naver-news/main/data/dart_ma_signals.json";
  var DURATION_PER_ITEM_S = 2.2; // 항목 하나가 지나가는 데 걸리는 시간(초) - index-ticker-mobile.html과 동일 속도

  // 캐시 버스터를 요청마다 달라지는 Date.now()(ms)가 아니라 1시간 단위로
  // 반올림한 값으로 고정한다 - ma-ticker.html(PC)과 동일한 이유(데이터가
  // DART 크롤러 주기(1시간)로만 갱신되므로, 그 이상 촘촘한 무효화는 CDN
  // 캐시 히트만 방해한다). index-ticker-mobile.html은 15분 주기인
  // stock_news.json을 보므로 이 값과는 별개(그쪽은 Date.now() 그대로 둠).
  var CACHE_BUCKET_MS = 1 * 60 * 60 * 1000;
  function cacheBuster() { return Math.floor(Date.now() / CACHE_BUCKET_MS); }

  // 카테고리 목록/뱃지 색상은 ma-ticker.html(PC)과 동일 - dart_ma_signals.json의
  // 오늘 날짜 키 안 5개 카테고리만 다룬다.
  var CATEGORIES = [
    { key: "합병_분할", label: "합병·분할", badgeClass: "cat-merge" },
    { key: "지분인수", label: "지분인수", badgeClass: "cat-equity" },
    { key: "주식교환_이전", label: "주식교환·이전", badgeClass: "cat-swap" },
    { key: "경영권이동_최대주주변경", label: "경영권이동", badgeClass: "cat-control" },
    { key: "자기주식", label: "자기주식", badgeClass: "cat-treasury" }
  ];

  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  // "[기재정정]주요사항보고서(타법인주식및출자증권양수결정)" 같은 원문
  // 보고서명에서 앞의 [..] 표시와 "주요사항보고서(...)" 포장을 벗겨
  // 핵심 문구만 남긴다. 가로 티커라 화면엔 안 보이고, title 툴팁용으로만 쓴다.
  function shortenReportName(name) {
    var s = (name || "").replace(/^\[[^\]]*\]/, "");
    var m = s.match(/주요사항보고서\(([^)]+)\)/);
    return m ? m[1] : s;
  }

  // DART는 rcept_dt(접수일자)를 날짜 단위(YYYYMMDD)로만 주고 시각 정보가
  // 없어서, 원문 링크(source_url)에 박힌 접수번호(rcpNo)를 정렬 키로
  // 추출한다 - ma-ticker.html(PC)과 동일한 방식.
  function extractRceptNo(url) {
    var m = (url || "").match(/rcpNo=(\d+)/);
    return m ? m[1] : "";
  }

  var track = document.getElementById("mth-track");
  var metaTextEl = document.getElementById("mth-meta-text");

  function toRow(raw, cat) {
    var url = raw.source_url;
    return {
      corp_name: raw.corp_name || "",
      desc: raw.action || shortenReportName(raw.report_nm),
      url: url,
      rceptNo: extractRceptNo(url) || (raw.rcept_dt || ""),
      categoryLabel: cat.label,
      badgeClass: cat.badgeClass
    };
  }

  function buildTimeSortedList(maToday) {
    var list = [];
    CATEGORIES.forEach(function (cat) {
      (maToday[cat.key] || []).forEach(function (raw) {
        list.push(toRow(raw, cat));
      });
    });
    list.sort(function (a, b) { return b.rceptNo.localeCompare(a.rceptNo); });
    return list;
  }

  function buildItem(item) {
    var a = document.createElement("a");
    a.className = "mth-item";
    a.href = item.url || "#";
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = item.corp_name + " · " + item.desc;

    var badge = document.createElement("span");
    badge.className = "mth-badge " + item.badgeClass;
    badge.textContent = item.categoryLabel;
    a.appendChild(badge);

    var nameEl = document.createElement("span");
    nameEl.className = "mth-name";
    nameEl.textContent = item.corp_name;
    a.appendChild(nameEl);

    return a;
  }

  fetch(DART_MA_URL + "?t=" + cacheBuster())
    .then(function (res) { return res.json(); })
    .then(function (maJson) {
      var maToday = (maJson && maJson[todayStr()]) || {};
      var items = buildTimeSortedList(maToday);

      if (!items.length) {
        track.innerHTML = '<span class="mth-loading">오늘 발생한 공시가 없습니다.</span>';
        metaTextEl.textContent = todayStr() + " 기준";
        return;
      }

      track.innerHTML = "";
      // 무한루프처럼 보이게 리스트를 두 번 이어붙임(index-ticker-mobile.html과 동일 기법)
      items.concat(items).forEach(function (item) { track.appendChild(buildItem(item)); });

      var totalSeconds = items.length * DURATION_PER_ITEM_S;
      track.style.animationDuration = totalSeconds + "s";

      metaTextEl.textContent = todayStr() + " 기준";
    })
    .catch(function (err) {
      track.innerHTML = '<span class="mth-loading">데이터를 불러오지 못했습니다.</span>';
      console.error("DART 공시 티커(모바일) 로드 실패:", err);
    });
})();
</script>

</body>
</html>
