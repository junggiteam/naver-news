<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주요 지표</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
</style>
</head>
<body>
<div id="idx-strip">
  <div class="is-header">
    <span class="is-label">주요 지표</span>
  </div>

  <div class="is-marquee-viewport">
    <div class="is-marquee-track" id="is-marquee-track">
      <p class="is-loading">불러오는 중...</p>
    </div>
  </div>

  <div class="is-meta" id="is-meta">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <span id="is-meta-text"></span>
  </div>
</div>

<style>
  #idx-strip {
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
    padding: 14px 18px 12px;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    font-family: "Noto Sans KR", "Malgun Gothic", -apple-system, sans-serif;
    box-sizing: border-box;
    background: #fff;
  }
  #idx-strip * { box-sizing: border-box; }

  .is-header {
    margin: -14px -18px 12px -18px;
    padding: 12px 18px;
    background: #142c67;
    border-radius: 10px 10px 0 0;
  }
  .is-label {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }

  /* 4줄만 보이는 창, 나머지는 위로 흐름 */
  .is-marquee-viewport {
    height: 136px; /* 34px x 4줄 */
    overflow: hidden;
    position: relative;
  }

  .is-marquee-track {
    animation: is-scroll-up linear infinite;
  }
  .is-marquee-viewport:hover .is-marquee-track {
    animation-play-state: paused;
  }

  @keyframes is-scroll-up {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
  }

  .is-loading { font-size: 13px; color: #aaa; }

  .is-row {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  /* flex + align-items:center로 배지/이미지를 이름 텍스트와 정확히
     세로 중앙 정렬한다 - vertical-align:middle만 믿으면 배지가 텍스트
     기준선보다 살짝 아래로 쏠려 보이는 버그가 있었다(2026-08 발견,
     news-widget.html의 .sw-index-name은 처음부터 flex라 이 문제가
     없었음). gap으로 간격을 주므로 배지 쪽 margin-right는 제거. */
  .is-row-name {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: #333;
    font-weight: 600;
    flex-shrink: 0;
  }
  /* 괄호 부분("(원/코인)", "(3년)" 등)만 이름 폰트보다 작고 옅은 색으로
     - 컨테이너가 300px로 좁아 이름+배지+값+등락률이 한 줄에 다 안
     들어가던 걸 완화하기 위해(2026-08). */
  .is-row-paren {
    font-size: 10px;
    color: #777;
  }
  /* 지표 이름 앞 원형 배지(색상 CSS 배지 + 실제 아이콘 이미지 혼용,
     widgets/assets/icons/). 크기는 .is-row-name 폰트(13px) 기준으로
     "이름 텍스트보다 아이콘이 커 보이지 않게" 맞춘 값(15px) - 예전엔
     22px까지 키웠다가 이름 텍스트 대비 과하다는 피드백을 받아 줄였고,
     이번엔 좁은 컨테이너(300px)에서 긴 값이 잘리는 걸 막기 위해 이름
     폰트와 함께 한 번 더 줄였다. em 체이닝은 안 쓰고 명시적 px로
     고정해 부모 폰트 크기와 무관하게 항상 일관된 크기로 보이게 한다. */
  .idx-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    flex: 0 0 auto;
    border-radius: 50%;
    font-size: 7.5px;
    font-weight: 800;
    line-height: 1;
  }
  /* 이미지 아이콘(국기/금/석유/EUR-USD)도 CSS 배지와 같은 지름으로
     맞춘다. 원본이 전부 정사각형이라 원형으로 잘라도(object-fit:cover)
     왜곡 없음. */
  .idx-badge-img {
    display: inline-block;
    width: 15px;
    height: 15px;
    flex: 0 0 auto;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid #dcdcdc;
  }
  /* 이모지(은행 등)는 텍스트보다 커야 원 안에 꽉 차 보여서, 기본
     폰트 크기보다 크게 잡는다. */
  .idx-badge-emoji {
    font-size: 9.5px;
  }
  /* 세 자리 숫자(100/200/500)는 원이 작아 기본 크기로는 안 들어가서
     더 작게. padding-top은 숫자 글리프가 원 중심보다 살짝 위로 쏠려
     보이는 미세한 세로 오차 보정(2026-08, 실제 렌더링 좌표 측정 후
     결정 - 텍스트 중심이 배지 중심보다 0.25~0.5px 위였음). position:
     relative + top은 배지 박스 전체(원+글자)를 같이 밀어버려서 내부
     정렬엔 아무 효과가 없다(실측으로 확인된 함정) - box-sizing:
     border-box가 전역 적용돼 있어 padding-top을 쓰면 원의 바깥 지름은
     그대로 두고 flex 중앙 정렬 기준선만 안쪽에서 미세하게 내릴 수
     있다. */
  .idx-badge-number {
    padding-top: 0.75px;
    font-size: 6px;
    letter-spacing: -0.03em;
  }
  .is-row-right {
    display: flex;
    align-items: baseline;
    gap: 7px;
    min-width: 0;
  }
  .is-row-value {
    font-size: 13px;
    font-weight: 700;
    color: #191919;
    white-space: nowrap;
  }
  .is-row-change {
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .is-row-change.up { color: #c0392b; }
  .is-row-change.down { color: #2a5db0; }
  .is-row-change.flat { color: #999; }

  .is-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #eee;
    font-size: 11px;
    color: #aaa;
  }
</style>

<script>
(function () {
  var STOCK_URL = "https://raw.githubusercontent.com/junggiteam/naver-news/main/data/stock_news.json";
  var DURATION_PER_ROW_S = 1.1; // 한 줄이 흘러가는 데 걸리는 시간(초) - 작을수록 빠름
  // 캐시 버스터를 요청마다 달라지는 Date.now()(ms) 대신 15분 단위로
  // 반올림한 값으로 고정한다. stock_news.json은 DART가 아니라 "stock"
  // 크롤러(run_scheduled.py의 CRAWLER_INTERVALS["stock"])가 채우는
  // 파일이고, 그 주기가 15분(지수 체감 실시간성을 위해 다른 크롤러보다
  // 훨씬 짧게 잡혀 있음)이라 이 값도 15분으로 맞춘다 - 예전엔 실수로
  // DART 3시간 주기를 그대로 복사해와서, 실제로는 15분마다 갱신되는
  // 데이터를 최대 3시간까지 묵혀서 보여줄 뻔했다(2026-08 정정). 같은
  // 15분 구간 안의 모든 방문자는 동일한 URL을 요청하게 돼
  // CDN(raw.githubusercontent.com)이 캐시를 공유할 수 있다.
  var CACHE_BUCKET_MS = 15 * 60 * 1000;
  function cacheBuster() { return Math.floor(Date.now() / CACHE_BUCKET_MS); }

  var track = document.getElementById("is-marquee-track");
  var metaTextEl = document.getElementById("is-meta-text");

  function arrow(direction) {
    if (direction === "up") return "▲";
    if (direction === "down") return "▼";
    return "-";
  }

  // widgets/assets/icons/의 실제 아이콘 이미지(국기/금/석유/EUR-USD) -
  // GitHub Pages 기준 절대 경로. news-widget.html/index-ticker-mobile.html
  // 도 동일한 경로를 쓴다.
  var ICON_BASE_URL = "https://junggiteam.github.io/naver-news/widgets/assets/icons/";

  // 지표 이름 -> 배지. 배열 순서: [매칭 키워드, 종류("image"/"number"/
  // "emoji"/""), 표시값(이미지면 파일명, 아니면 기호/숫자), 배경색
  // (그라디언트 가능, 이미지는 안 씀), 글자색(이미지는 안 씀), 테두리색
  // (선택)]. 더 구체적인 키워드를 먼저 검사한다("나스닥100"이 "나스닥"의,
  // "코스피200"이 "코스피"의 부분 문자열이라 순서가 바뀌면 일반 규칙에
  // 먼저 걸려버림). 매칭되는 항목이 없으면 배지를 안 붙인다.
  var INDEX_BADGES = [
    ["나스닥100", "number", "100", "#eef4ff", "#1d4ed8", "#d8e5ff"],
    ["나스닥", "image", "usa-flag.png", "", "", ""],
    ["다우존스", "image", "usa-flag.png", "", "", ""],
    ["S&P500", "number", "500", "linear-gradient(135deg, #f87171, #dc2626)", "#fff", ""],
    ["이더리움", "", "◆", "linear-gradient(135deg, #9da8ff, #5966d9 55%, #393aa1)", "#eef2ff", ""],
    ["비트코인", "", "₿", "linear-gradient(135deg, #ffb249, #f7931a 60%, #d97706)", "#fff", ""],
    ["코스피200", "number", "200", "#eef4ff", "#1d4ed8", "#d8e5ff"],
    ["코스피", "image", "kor-flag.png", "", "", ""],
    ["코스닥", "image", "kor-flag.png", "", "", ""],
    ["국내금", "image", "gold.png", "", "", ""],
    ["휘발유", "image", "oil.png", "", "", ""],
    ["국고채", "emoji", "🏦", "#eef6ff", "#2563eb", "#dbeafe"],
    ["WTI", "", "", "#2B2B2B", "#fff", ""],
    ["EUR/USD", "image", "eurusd-icon.png", "", "", ""],
    ["원/유로", "", "€", "#eef6ff", "#2563eb", "#dbeafe"],
    ["원/엔", "", "¥", "#eef6ff", "#2563eb", "#dbeafe"],
    ["원/달러", "", "$", "#eef6ff", "#2563eb", "#dbeafe"]
  ];

  function badgeHtml(name) {
    for (var i = 0; i < INDEX_BADGES.length; i++) {
      var b = INDEX_BADGES[i];
      if (name.indexOf(b[0]) !== -1) {
        var kind = b[1], value = b[2], bg = b[3], color = b[4], border = b[5];
        if (kind === "image") {
          return '<img class="idx-badge-img" src="' + ICON_BASE_URL + value + '" alt="">';
        }
        var cls = "idx-badge" + (kind ? " idx-badge-" + kind : "");
        var style = "background:" + bg + ";color:" + color + ";" + (border ? "border:1px solid " + border + ";" : "");
        return '<span class="' + cls + '" style="' + style + '">' + value + '</span>';
      }
    }
    return "";
  }

  // "이름(괄호)" 패턴이면 괄호 부분만 분리해서 더 작은 폰트(.is-row-paren)로
  // 렌더링한다("비트코인(원/코인)" -> "비트코인" + 작은 "(원/코인)") -
  // 좁은 컨테이너에서 값이 잘리는 걸 완화하기 위해(2026-08). 괄호가
  // 없는 이름은 그대로 반환.
  function nameHtml(name) {
    var m = name.match(/^(.+?)(\([^()]*\))$/);
    if (!m) return name;
    return m[1] + '<span class="is-row-paren">' + m[2] + '</span>';
  }

  function buildRow(idx) {
    var cleanPercent = (idx.change_percent || "").replace(/^[▲▼△▽+\-\s]+/, "").trim();
    var dirClass = idx.direction === "up" ? "up" : idx.direction === "down" ? "down" : "flat";
    var row = document.createElement("div");
    row.className = "is-row";
    row.innerHTML =
      '<span class="is-row-name">' + badgeHtml(idx.name) + nameHtml(idx.name) + '</span>' +
      '<span class="is-row-right">' +
        '<span class="is-row-value">' + idx.value + '</span>' +
        '<span class="is-row-change ' + dirClass + '">' + arrow(idx.direction) + ' ' + cleanPercent + '</span>' +
      '</span>';
    return row;
  }

  fetch(STOCK_URL + "?t=" + cacheBuster())
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var indices = data.indices || [];
      if (!indices.length) {
        track.innerHTML = '<p class="is-loading">지표 데이터가 없습니다.</p>';
        return;
      }

      track.innerHTML = "";
      // 무한루프처럼 보이게 리스트를 두 번 이어붙임 (뒤 절반이 앞 절반과 동일)
      indices.concat(indices).forEach(function (idx) {
        track.appendChild(buildRow(idx));
      });

      var totalSeconds = indices.length * DURATION_PER_ROW_S;
      track.style.animationDuration = totalSeconds + "s";

      metaTextEl.textContent = data.updated_at ? data.updated_at + " 기준" : "";
    })
    .catch(function (err) {
      track.innerHTML = '<p class="is-loading">지표를 불러오지 못했습니다.</p>';
      console.error("지수 티커 로드 실패:", err);
    });
})();
</script>
</body></html>
