<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주요 지표</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
</style>
</head>
<body>
<div id="idx-strip">
  <div class="is-header">
    <span class="is-label">주요 지표</span>
  </div>

  <div class="is-marquee-viewport">
    <div class="is-marquee-track" id="is-marquee-track">
      <p class="is-loading">불러오는 중...</p>
    </div>
  </div>

  <div class="is-meta" id="is-meta">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <span id="is-meta-text"></span>
  </div>
</div>

<style>
  #idx-strip {
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
    padding: 14px 18px 12px;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    font-family: "Noto Sans KR", "Malgun Gothic", -apple-system, sans-serif;
    box-sizing: border-box;
    background: #fff;
  }
  #idx-strip * { box-sizing: border-box; }

  .is-header {
    margin: -14px -18px 12px -18px;
    padding: 12px 18px;
    background: #142c67;
    border-radius: 10px 10px 0 0;
  }
  .is-label {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }

  /* 4줄만 보이는 창, 나머지는 위로 흐름 */
  .is-marquee-viewport {
    height: 136px; /* 34px x 4줄 */
    overflow: hidden;
    position: relative;
  }

  .is-marquee-track {
    animation: is-scroll-up linear infinite;
  }
  .is-marquee-viewport:hover .is-marquee-track {
    animation-play-state: paused;
  }

  @keyframes is-scroll-up {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
  }

  .is-loading { font-size: 13px; color: #aaa; }

  .is-row {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .is-row-name {
    font-size: 14px;
    color: #333;
    font-weight: 600;
    flex-shrink: 0;
  }
  /* 지표 이름 앞 원형 배지 - 외부 아이콘 이미지 없이 순수 CSS로(색상+
     기호/숫자/이모지). em 체이닝 대신 명시적 px로 고정해 부모 폰트
     크기와 무관하게 항상 일관된 크기로 보이게 한다. */
  .idx-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    margin-right: 4px;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 800;
    line-height: 1;
    vertical-align: middle;
  }
  /* 이모지(국기/금메달/주유소/은행 등)는 텍스트보다 커야 원 안에 꽉
     차 보여서, 기본 폰트 크기보다 2px 더 키운다. */
  .idx-badge-emoji {
    font-size: 12px;
  }
  .is-row-right {
    display: flex;
    align-items: baseline;
    gap: 7px;
    min-width: 0;
  }
  .is-row-value {
    font-size: 14px;
    font-weight: 700;
    color: #191919;
    white-space: nowrap;
  }
  .is-row-change {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .is-row-change.up { color: #c0392b; }
  .is-row-change.down { color: #2a5db0; }
  .is-row-change.flat { color: #999; }

  .is-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #eee;
    font-size: 11px;
    color: #aaa;
  }
</style>

<script>
(function () {
  var STOCK_URL = "https://raw.githubusercontent.com/junggiteam/naver-news/main/data/stock_news.json";
  var DURATION_PER_ROW_S = 1.1; // 한 줄이 흘러가는 데 걸리는 시간(초) - 작을수록 빠름
  // 캐시 버스터를 요청마다 달라지는 Date.now()(ms) 대신 15분 단위로
  // 반올림한 값으로 고정한다. stock_news.json은 DART가 아니라 "stock"
  // 크롤러(run_scheduled.py의 CRAWLER_INTERVALS["stock"])가 채우는
  // 파일이고, 그 주기가 15분(지수 체감 실시간성을 위해 다른 크롤러보다
  // 훨씬 짧게 잡혀 있음)이라 이 값도 15분으로 맞춘다 - 예전엔 실수로
  // DART 3시간 주기를 그대로 복사해와서, 실제로는 15분마다 갱신되는
  // 데이터를 최대 3시간까지 묵혀서 보여줄 뻔했다(2026-08 정정). 같은
  // 15분 구간 안의 모든 방문자는 동일한 URL을 요청하게 돼
  // CDN(raw.githubusercontent.com)이 캐시를 공유할 수 있다.
  var CACHE_BUCKET_MS = 15 * 60 * 1000;
  function cacheBuster() { return Math.floor(Date.now() / CACHE_BUCKET_MS); }

  var track = document.getElementById("is-marquee-track");
  var metaTextEl = document.getElementById("is-meta-text");

  function arrow(direction) {
    if (direction === "up") return "▲";
    if (direction === "down") return "▼";
    return "-";
  }

  // 지표 이름 -> 원형 배지(기호/숫자/이모지 + 배경색[ + 테두리색]).
  // 배열 순서: [매칭 키워드, 표시 문자, 배경색, 글자색, 이모지 여부,
  // 테두리색(선택)]. 더 구체적인 키워드를 먼저 검사한다("나스닥100"이
  // "나스닥"의, "코스피200"이 "코스피"의 부분 문자열이라 순서가 바뀌면
  // 일반 규칙에 먼저 걸려버림). 매칭되는 항목이 없으면 배지를 안 붙인다.
  var INDEX_BADGES = [
    ["나스닥100", "100", "#3182F6", "#fff", false],
    ["나스닥", "🇺🇸", "#3182F6", "#fff", true],
    ["다우존스", "30", "#142c67", "#fff", false],
    ["S&P500", "500", "#142c67", "#fff", false],
    ["이더리움", "Ξ", "#627EEA", "#fff", false],
    ["비트코인", "₿", "#F7931A", "#fff", false],
    ["코스피200", "200", "#142c67", "#fff", false],
    ["코스피", "🇰🇷", "#ffffff", "#142c67", true, "#dcdcdc"],
    ["코스닥", "🇰🇷", "#ffffff", "#142c67", true, "#dcdcdc"],
    ["국내금", "🥇", "#D4AF37", "#fff", true],
    ["휘발유", "⛽", "#8B5E3C", "#fff", true],
    ["국고채", "🏦", "#4A5568", "#fff", true],
    ["WTI", "", "#2B2B2B", "#fff", false],
    ["EUR/USD", "€", "#E4EAF5", "#142c67", false],
    ["원/유로", "€", "#E4EAF5", "#142c67", false],
    ["원/엔", "¥", "#E4EAF5", "#142c67", false],
    ["원/달러", "$", "#E4EAF5", "#142c67", false]
  ];

  function badgeHtml(name) {
    for (var i = 0; i < INDEX_BADGES.length; i++) {
      var b = INDEX_BADGES[i];
      if (name.indexOf(b[0]) !== -1) {
        var symbol = b[1], bg = b[2], color = b[3], isEmoji = b[4], border = b[5];
        var cls = "idx-badge" + (isEmoji ? " idx-badge-emoji" : "");
        var style = "background:" + bg + ";color:" + color + ";" + (border ? "border:1px solid " + border + ";" : "");
        return '<span class="' + cls + '" style="' + style + '">' + symbol + '</span>';
      }
    }
    return "";
  }

  function buildRow(idx) {
    var cleanPercent = (idx.change_percent || "").replace(/^[▲▼△▽+\-\s]+/, "").trim();
    var dirClass = idx.direction === "up" ? "up" : idx.direction === "down" ? "down" : "flat";
    var row = document.createElement("div");
    row.className = "is-row";
    row.innerHTML =
      '<span class="is-row-name">' + badgeHtml(idx.name) + idx.name + '</span>' +
      '<span class="is-row-right">' +
        '<span class="is-row-value">' + idx.value + '</span>' +
        '<span class="is-row-change ' + dirClass + '">' + arrow(idx.direction) + ' ' + cleanPercent + '</span>' +
      '</span>';
    return row;
  }

  fetch(STOCK_URL + "?t=" + cacheBuster())
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var indices = data.indices || [];
      if (!indices.length) {
        track.innerHTML = '<p class="is-loading">지표 데이터가 없습니다.</p>';
        return;
      }

      track.innerHTML = "";
      // 무한루프처럼 보이게 리스트를 두 번 이어붙임 (뒤 절반이 앞 절반과 동일)
      indices.concat(indices).forEach(function (idx) {
        track.appendChild(buildRow(idx));
      });

      var totalSeconds = indices.length * DURATION_PER_ROW_S;
      track.style.animationDuration = totalSeconds + "s";

      metaTextEl.textContent = data.updated_at ? data.updated_at + " 기준" : "";
    })
    .catch(function (err) {
      track.innerHTML = '<p class="is-loading">지표를 불러오지 못했습니다.</p>';
      console.error("지수 티커 로드 실패:", err);
    });
})();
</script>
</body></html>
