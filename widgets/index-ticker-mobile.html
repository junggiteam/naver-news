<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주요 지표 (모바일)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
  }
</style>
</head>
<body>

<div id="idx-strip-h">
  <div class="ish-header">
    <span class="ish-label">주요 지표</span>
  </div>

  <div class="ish-viewport">
    <div class="ish-track" id="ish-track">
      <span class="ish-loading">불러오는 중...</span>
    </div>
  </div>

  <div class="ish-meta">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <span id="ish-meta-text"></span>
  </div>
</div>

<style>
  #idx-strip-h {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 14px 18px 12px;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    font-family: "Noto Sans KR", "Malgun Gothic", -apple-system, sans-serif;
    box-sizing: border-box;
    background: #fff;
  }
  #idx-strip-h * { box-sizing: border-box; }

  .ish-header {
    margin: -14px -18px 10px -18px;
    padding: 10px 18px;
    background: #142c67;
    border-radius: 10px 10px 0 0;
  }
  .ish-label {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }

  /* 가로로 흐르는 티커 영역 */
  .ish-viewport {
    overflow: hidden;
    white-space: nowrap;
  }

  .ish-track {
    display: inline-flex;
    align-items: center;
    animation: ish-scroll-left linear infinite;
  }
  .ish-track.ish-paused {
    animation-play-state: paused;
  }

  @keyframes ish-scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .ish-loading { font-size: 13px; color: #aaa; }

  .ish-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 18px;
    border-right: 1px solid #eee;
    white-space: nowrap;
  }
  .ish-item:last-child { border-right: none; }

  /* flex + align-items:center로 배지/이미지를 이름 텍스트와 정확히
     세로 중앙 정렬한다 - vertical-align:middle만 믿으면 배지가 텍스트
     기준선보다 살짝 아래로 쏠려 보이는 버그가 있었다(2026-08 발견,
     news-widget.html의 .sw-index-name은 처음부터 flex라 이 문제가
     없었음). gap으로 간격을 주므로 배지 쪽 margin-right는 제거.
     .ish-item 자체의 align-items:baseline(이름/값/등락률 세 요소 간
     정렬)과는 별개 - 이건 .ish-name 내부(배지+텍스트)만의 정렬이다. */
  .ish-name {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 14px;
    font-weight: 600;
    color: #333;
  }
  /* 지표 이름 앞 배지(색상 CSS 배지 + 실제 아이콘 이미지 혼용,
     widgets/assets/icons/). 크기는 .ish-name 폰트(14px) 기준으로
     "이름 텍스트보다 아이콘이 커 보이지 않게" 맞춘 값(17px) - 예전엔
     22px까지 키웠다가 이름 텍스트 대비 과하다는 피드백을 받아 다시
     줄였다. em 체이닝은 안 쓰고 명시적 px로 고정해 부모 폰트 크기와
     무관하게 항상 일관된 크기로 보이게 한다. */
  .idx-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 17px;
    height: 17px;
    flex: 0 0 auto;
    border-radius: 50%;
    font-size: 8.5px;
    font-weight: 800;
    line-height: 1;
  }
  /* 이미지 아이콘(국기/금/석유/EUR-USD)도 CSS 배지와 같은 지름으로
     맞춘다. 원본이 전부 정사각형이라 원형으로 잘라도(object-fit:cover)
     왜곡 없음. */
  .idx-badge-img {
    display: inline-block;
    width: 17px;
    height: 17px;
    flex: 0 0 auto;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid #dcdcdc;
  }
  /* 이모지(은행 등)는 텍스트보다 커야 원 안에 꽉 차 보여서, 기본
     폰트 크기보다 크게 잡는다. */
  .idx-badge-emoji {
    font-size: 10.5px;
  }
  /* 세 자리 숫자(100/200/500)는 원이 작아 기본 크기로는 안 들어가서
     더 작게. 숫자 글리프가 원 중심보다 살짝 위로 쏠려 보이는 미세한
     세로 오차는 과거 padding-top으로 보정했었으나(2026-08 초), 텍스트
     baseline이 CSS 정수 픽셀 단위로 스냅되는 렌더링 특성 때문에
     0.5~2px 사이의 어떤 padding-top 값을 줘도 전부 똑같이 렌더링되는
     것을 고배율 스크린샷 실측(Playwright + 픽셀 단위 잉크 위치 분석)
     으로 확인했다 - 그래서 세밀 보정이 아예 불가능했던 것. 텍스트만
     감싸는 내부 span(.idx-badge-number-ink)에 transform: translateY()
     를 쓰면 레이아웃이 아니라 합성(compositing) 단계에서 적용돼
     스냅 없이 연속적으로 움직인다(실측 확인) - 이걸로 전환.
     transform을 배지 자체(.idx-badge-number)에 걸면 원과 글자가 같이
     움직여 내부 정렬에 아무 효과가 없으므로(예전 position:relative+top
     함정과 동일한 원리) 반드시 내부 wrap에만 걸어야 한다. */
  .idx-badge-number {
    font-size: 6.5px;
    letter-spacing: -0.03em;
  }
  .idx-badge-number-ink {
    display: inline-block;
    transform: translateY(-0.08px);
  }
  .ish-value {
    font-size: 15px;
    font-weight: 800;
    color: #191919;
  }
  .ish-change {
    font-size: 13.5px;
    font-weight: 700;
  }
  .ish-change.up { color: #c0392b; }
  .ish-change.down { color: #2a5db0; }
  .ish-change.flat { color: #999; }

  .ish-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #eee;
    font-size: 11px;
    color: #aaa;
  }

  /* 상단 남색 롤링 티커바(theme=dark)용 - 헤더/카드 껍데기 없이
     한 줄 가로 스크롤 티커 + 우측 고정 타임스탬프로 전환. */
  #idx-strip-h.theme-dark {
    background: #142c67;
    border: none;
    border-radius: 0;
    padding: 0;
    max-width: none;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .theme-dark .ish-header { display: none; }

  .theme-dark .ish-viewport {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .theme-dark .ish-name  { color: #fff; }
  .theme-dark .ish-value { color: #fff; }
  .theme-dark .ish-item  { border-right-color: rgba(255,255,255,0.25); }

  /* 남색 배경에서 기본 등락률 색(빨강 #c0392b/파랑 #2a5db0)의 대비가
     너무 낮아(실측 대비율 각각 2.43:1, 2.08:1로 WCAG AA 4.5:1 미달)
     밝은 톤으로 교체 - Playwright로 상승/하락 두 색 모두 실측 후 확정. */
  .theme-dark .ish-change.up   { color: #ff6b6b; }
  .theme-dark .ish-change.down { color: #7fb2ff; }

  .theme-dark .ish-meta {
    flex: 0 0 auto;
    margin-top: 0;
    padding-top: 0;
    padding-left: 14px;
    border-top: none;
    border-left: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
  }
</style>

<script>
(function () {
  var STOCK_URL = "https://raw.githubusercontent.com/junggiteam/naver-news/main/data/stock_news.json";
  var DURATION_PER_ITEM_S = 2.2; // 항목 하나가 지나가는 데 걸리는 시간(초) - 작을수록 빠름

  if (new URLSearchParams(location.search).get("theme") === "dark") {
    document.getElementById("idx-strip-h").classList.add("theme-dark");
  }

  var track = document.getElementById("ish-track");
  var metaTextEl = document.getElementById("ish-meta-text");
  var viewport = document.querySelector(".ish-viewport");

  // 지수 영역을 탭할 때마다 멈춤 <-> 재생 토글.
  // (기존 CSS :hover 방식은 모바일에서 탭한 영역에만 붙어있어서,
  //  다시 그 영역을 터치해도 안 풀리고 다른 영역을 터치해야 풀리는 문제가 있었음)
  viewport.addEventListener("click", function () {
    track.classList.toggle("ish-paused");
  });

  function arrow(direction) {
    if (direction === "up") return "▲";
    if (direction === "down") return "▼";
    return "-";
  }

  // widgets/assets/icons/의 실제 아이콘 이미지(국기/금/석유/EUR-USD) -
  // GitHub Pages 기준 절대 경로. index-ticker.html과 동일한 매핑을
  // 유지한다(공용 JS 모듈이 없는 정적 위젯 구조라 파일별로 각자 들고
  // 있음 - 이 배지 팔레트를 바꿀 땐 index-ticker.html/
  // index-ticker-mobile.html/news-widget.html 세 곳을 함께 확인할 것).
  var ICON_BASE_URL = "https://junggiteam.github.io/naver-news/widgets/assets/icons/";

  // 지표 이름 -> 배지. 배열 순서: [매칭 키워드, 종류("image"/"number"/
  // "emoji"/""), 표시값(이미지면 파일명, 아니면 기호/숫자), 배경색
  // (그라디언트 가능, 이미지는 안 씀), 글자색(이미지는 안 씀), 테두리색
  // (선택)]. 더 구체적인 키워드를 먼저 검사한다("나스닥100"이 "나스닥"의,
  // "코스피200"이 "코스피"의 부분 문자열).
  var INDEX_BADGES = [
    ["나스닥100", "number", "100", "#eef4ff", "#1d4ed8", "#d8e5ff"],
    ["나스닥", "image", "usa-flag.png", "", "", ""],
    ["다우존스", "image", "usa-flag.png", "", "", ""],
    ["S&P500", "number", "500", "linear-gradient(135deg, #f87171, #dc2626)", "#fff", ""],
    ["이더리움", "", "◆", "linear-gradient(135deg, #9da8ff, #5966d9 55%, #393aa1)", "#eef2ff", ""],
    ["비트코인", "", "₿", "linear-gradient(135deg, #ffb249, #f7931a 60%, #d97706)", "#fff", ""],
    ["코스피200", "number", "200", "#eef4ff", "#1d4ed8", "#d8e5ff"],
    ["코스피", "image", "kor-flag.png", "", "", ""],
    ["코스닥", "image", "kor-flag.png", "", "", ""],
    ["국내금", "image", "gold.png", "", "", ""],
    ["휘발유", "image", "oil.png", "", "", ""],
    ["국고채", "emoji", "🏦", "#eef6ff", "#2563eb", "#dbeafe"],
    ["WTI", "", "", "#2B2B2B", "#fff", ""],
    ["EUR/USD", "image", "eurusd-icon.png", "", "", ""],
    ["USD/JPY", "image", "usjapan-icon.png", "", "", ""],
    ["원/유로", "", "€", "#eef6ff", "#2563eb", "#dbeafe"],
    ["원/엔", "", "¥", "#eef6ff", "#2563eb", "#dbeafe"],
    ["원/달러", "", "$", "#eef6ff", "#2563eb", "#dbeafe"]
  ];

  function badgeHtml(name) {
    for (var i = 0; i < INDEX_BADGES.length; i++) {
      var b = INDEX_BADGES[i];
      if (name.indexOf(b[0]) !== -1) {
        var kind = b[1], value = b[2], bg = b[3], color = b[4], border = b[5];
        if (kind === "image") {
          return '<img class="idx-badge-img" src="' + ICON_BASE_URL + value + '" alt="">';
        }
        var cls = "idx-badge" + (kind ? " idx-badge-" + kind : "");
        var style = "background:" + bg + ";color:" + color + ";" + (border ? "border:1px solid " + border + ";" : "");
        var inner = kind === "number" ? '<span class="idx-badge-number-ink">' + value + '</span>' : value;
        return '<span class="' + cls + '" style="' + style + '">' + inner + '</span>';
      }
    }
    return "";
  }

  function buildItem(idx) {
    var cleanPercent = (idx.change_percent || "").replace(/^[▲▼△▽+\-\s]+/, "").trim();
    var dirClass = idx.direction === "up" ? "up" : idx.direction === "down" ? "down" : "flat";
    var el = document.createElement("span");
    el.className = "ish-item";
    el.innerHTML =
      '<span class="ish-name">' + badgeHtml(idx.name) + idx.name + '</span>' +
      '<span class="ish-value">' + idx.value + '</span>' +
      '<span class="ish-change ' + dirClass + '">' + arrow(idx.direction) + ' ' + cleanPercent + '</span>';
    return el;
  }

  fetch(STOCK_URL + "?t=" + Date.now())
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var indices = data.indices || [];
      if (!indices.length) {
        track.innerHTML = '<span class="ish-loading">지표 데이터가 없습니다.</span>';
        return;
      }

      track.innerHTML = "";
      // 무한루프처럼 보이게 리스트를 두 번 이어붙임
      indices.concat(indices).forEach(function (idx) {
        track.appendChild(buildItem(idx));
      });

      var totalSeconds = indices.length * DURATION_PER_ITEM_S;
      track.style.animationDuration = totalSeconds + "s";

      metaTextEl.textContent = data.updated_at ? data.updated_at + " 기준" : "";
    })
    .catch(function (err) {
      track.innerHTML = '<span class="ish-loading">지표를 불러오지 못했습니다.</span>';
      console.error("지수 티커(모바일) 로드 실패:", err);
    });
})();
</script>

</body>
</html>
