<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주요 지표 (모바일)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
</style>
</head>
<body>

<div id="idx-strip-h">
  <div class="ish-header">
    <span class="ish-label">주요 지표</span>
  </div>

  <div class="ish-viewport">
    <div class="ish-track" id="ish-track">
      <span class="ish-loading">불러오는 중...</span>
    </div>
  </div>

  <div class="ish-meta">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <span id="ish-meta-text"></span>
  </div>
</div>

<style>
  #idx-strip-h {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 14px 18px 12px;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    font-family: "Noto Sans KR", "Malgun Gothic", -apple-system, sans-serif;
    box-sizing: border-box;
    background: #fff;
  }
  #idx-strip-h * { box-sizing: border-box; }

  .ish-header {
    margin: -14px -18px 10px -18px;
    padding: 10px 18px;
    background: #142c67;
    border-radius: 10px 10px 0 0;
  }
  .ish-label {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }

  /* 가로로 흐르는 티커 영역 */
  .ish-viewport {
    overflow: hidden;
    white-space: nowrap;
  }

  .ish-track {
    display: inline-flex;
    align-items: baseline;
    animation: ish-scroll-left linear infinite;
  }
  .ish-track.ish-paused {
    animation-play-state: paused;
  }

  @keyframes ish-scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .ish-loading { font-size: 13px; color: #aaa; }

  .ish-item {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    padding: 0 18px;
    border-right: 1px solid #eee;
    white-space: nowrap;
  }
  .ish-item:last-child { border-right: none; }

  .ish-name {
    font-size: 14px;
    font-weight: 600;
    color: #333;
  }
  /* 지표 이름 앞 원형 배지 - 순수 CSS(색상+기호/숫자/이모지), 외부
     아이콘 이미지 없음. em 체이닝 대신 명시적 px로 고정해 부모 폰트
     크기와 무관하게 항상 일관된 크기로 보이게 한다. */
  .idx-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    margin-right: 4px;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 800;
    line-height: 1;
    vertical-align: middle;
  }
  /* 이모지(국기/금메달/주유소/은행 등)는 텍스트보다 커야 원 안에 꽉
     차 보여서, 기본 폰트 크기보다 2px 더 키운다. */
  .idx-badge-emoji {
    font-size: 12px;
  }
  .ish-value {
    font-size: 15px;
    font-weight: 800;
    color: #191919;
  }
  .ish-change {
    font-size: 13.5px;
    font-weight: 700;
  }
  .ish-change.up { color: #c0392b; }
  .ish-change.down { color: #2a5db0; }
  .ish-change.flat { color: #999; }

  .ish-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #eee;
    font-size: 11px;
    color: #aaa;
  }
</style>

<script>
(function () {
  var STOCK_URL = "https://raw.githubusercontent.com/junggiteam/naver-news/main/data/stock_news.json";
  var DURATION_PER_ITEM_S = 2.2; // 항목 하나가 지나가는 데 걸리는 시간(초) - 작을수록 빠름

  var track = document.getElementById("ish-track");
  var metaTextEl = document.getElementById("ish-meta-text");
  var viewport = document.querySelector(".ish-viewport");

  // 지수 영역을 탭할 때마다 멈춤 <-> 재생 토글.
  // (기존 CSS :hover 방식은 모바일에서 탭한 영역에만 붙어있어서,
  //  다시 그 영역을 터치해도 안 풀리고 다른 영역을 터치해야 풀리는 문제가 있었음)
  viewport.addEventListener("click", function () {
    track.classList.toggle("ish-paused");
  });

  function arrow(direction) {
    if (direction === "up") return "▲";
    if (direction === "down") return "▼";
    return "-";
  }

  // 지표 이름 -> 원형 배지(기호/숫자/이모지 + 배경색[ + 테두리색]).
  // index-ticker.html과 동일한 매핑을 유지한다(공용 JS 모듈이 없는
  // 정적 위젯 구조라 파일별로 각자 들고 있음 - 이 배지 팔레트를 바꿀
  // 땐 index-ticker.html/index-ticker-mobile.html/news-widget.html
  // 세 곳을 함께 확인할 것). 배열 순서: [매칭 키워드, 표시 문자,
  // 배경색, 글자색, 이모지 여부, 테두리색(선택)]. 더 구체적인 키워드를
  // 먼저 검사한다("나스닥100"이 "나스닥"의, "코스피200"이 "코스피"의
  // 부분 문자열).
  var INDEX_BADGES = [
    ["나스닥100", "100", "#3182F6", "#fff", false],
    ["나스닥", "🇺🇸", "#3182F6", "#fff", true],
    ["다우존스", "30", "#142c67", "#fff", false],
    ["S&P500", "500", "#142c67", "#fff", false],
    ["이더리움", "Ξ", "#627EEA", "#fff", false],
    ["비트코인", "₿", "#F7931A", "#fff", false],
    ["코스피200", "200", "#142c67", "#fff", false],
    ["코스피", "🇰🇷", "#ffffff", "#142c67", true, "#dcdcdc"],
    ["코스닥", "🇰🇷", "#ffffff", "#142c67", true, "#dcdcdc"],
    ["국내금", "🥇", "#D4AF37", "#fff", true],
    ["휘발유", "⛽", "#8B5E3C", "#fff", true],
    ["국고채", "🏦", "#4A5568", "#fff", true],
    ["WTI", "", "#2B2B2B", "#fff", false],
    ["EUR/USD", "€", "#E4EAF5", "#142c67", false],
    ["원/유로", "€", "#E4EAF5", "#142c67", false],
    ["원/엔", "¥", "#E4EAF5", "#142c67", false],
    ["원/달러", "$", "#E4EAF5", "#142c67", false]
  ];

  function badgeHtml(name) {
    for (var i = 0; i < INDEX_BADGES.length; i++) {
      var b = INDEX_BADGES[i];
      if (name.indexOf(b[0]) !== -1) {
        var symbol = b[1], bg = b[2], color = b[3], isEmoji = b[4], border = b[5];
        var cls = "idx-badge" + (isEmoji ? " idx-badge-emoji" : "");
        var style = "background:" + bg + ";color:" + color + ";" + (border ? "border:1px solid " + border + ";" : "");
        return '<span class="' + cls + '" style="' + style + '">' + symbol + '</span>';
      }
    }
    return "";
  }

  function buildItem(idx) {
    var cleanPercent = (idx.change_percent || "").replace(/^[▲▼△▽+\-\s]+/, "").trim();
    var dirClass = idx.direction === "up" ? "up" : idx.direction === "down" ? "down" : "flat";
    var el = document.createElement("span");
    el.className = "ish-item";
    el.innerHTML =
      '<span class="ish-name">' + badgeHtml(idx.name) + idx.name + '</span>' +
      '<span class="ish-value">' + idx.value + '</span>' +
      '<span class="ish-change ' + dirClass + '">' + arrow(idx.direction) + ' ' + cleanPercent + '</span>';
    return el;
  }

  fetch(STOCK_URL + "?t=" + Date.now())
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var indices = data.indices || [];
      if (!indices.length) {
        track.innerHTML = '<span class="ish-loading">지표 데이터가 없습니다.</span>';
        return;
      }

      track.innerHTML = "";
      // 무한루프처럼 보이게 리스트를 두 번 이어붙임
      indices.concat(indices).forEach(function (idx) {
        track.appendChild(buildItem(idx));
      });

      var totalSeconds = indices.length * DURATION_PER_ITEM_S;
      track.style.animationDuration = totalSeconds + "s";

      metaTextEl.textContent = data.updated_at ? data.updated_at + " 기준" : "";
    })
    .catch(function (err) {
      track.innerHTML = '<span class="ish-loading">지표를 불러오지 못했습니다.</span>';
      console.error("지수 티커(모바일) 로드 실패:", err);
    });
})();
</script>

</body>
</html>
