<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&amp;A 공시</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
</style>
</head>
<body>
<div id="mt-strip">
  <div class="mt-header">
    <span class="mt-label">M&amp;A 공시</span>
  </div>

  <div class="mt-tabs" id="mt-tabs">
    <button class="mt-tab active" type="button" data-tab="filings">주요공시</button>
    <button class="mt-tab" type="button" data-tab="합병_분할">합병·분할</button>
    <button class="mt-tab" type="button" data-tab="지분인수">지분인수</button>
    <button class="mt-tab" type="button" data-tab="주식교환_이전">주식교환·이전</button>
    <button class="mt-tab" type="button" data-tab="경영권이동_최대주주변경">경영권이동</button>
    <button class="mt-tab" type="button" data-tab="자기주식">자기주식</button>
  </div>

  <div class="mt-marquee-viewport">
    <div class="mt-marquee-track" id="mt-marquee-track">
      <p class="mt-empty">불러오는 중...</p>
    </div>
  </div>

  <div class="mt-meta" id="mt-meta">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <span id="mt-meta-text"></span>
  </div>
</div>

<style>
  #mt-strip {
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
    padding: 14px 18px 12px;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    font-family: "Noto Sans KR", "Malgun Gothic", -apple-system, sans-serif;
    box-sizing: border-box;
    background: #fff;
  }
  #mt-strip * { box-sizing: border-box; }

  .mt-header {
    margin: -14px -18px 10px -18px;
    padding: 12px 18px;
    background: #142c67;
    border-radius: 10px 10px 0 0;
  }
  .mt-label {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }

  /* 탭 6개가 300px 폭에 다 안 들어가므로 가로 스크롤 pill 스트립으로 처리 */
  .mt-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0 0 10px;
    padding-bottom: 2px;
    scrollbar-width: thin;
  }
  .mt-tabs::-webkit-scrollbar { height: 3px; }
  .mt-tabs::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

  .mt-tab {
    flex: 0 0 auto;
    padding: 5px 10px;
    border: 1px solid #dcdcdc;
    border-radius: 999px;
    background: #fff;
    color: #555;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .mt-tab.active {
    background: #142c67;
    border-color: #142c67;
    color: #fff;
  }

  /* 3줄만 보이는 창, 항목이 그보다 많을 때만 아래->위로 흐름 */
  .mt-marquee-viewport {
    height: 102px; /* 34px x 3줄 */
    overflow: hidden;
    position: relative;
  }

  /* 항목이 3개 이하면 이 클래스가 안 붙어서 애니메이션 없이 정적으로 표시된다 */
  .mt-marquee-track.mt-scrolling {
    animation: mt-scroll-up linear infinite;
  }
  .mt-marquee-viewport:hover .mt-marquee-track.mt-scrolling {
    animation-play-state: paused;
  }

  @keyframes mt-scroll-up {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
  }

  .mt-empty { font-size: 13px; color: #aaa; padding: 8px 0; }

  .mt-row {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    color: inherit;
    text-decoration: none;
  }
  .mt-row:hover .mt-row-name,
  .mt-row:hover .mt-row-label { color: #142c67; }
  .mt-row-name {
    font-size: 13px;
    color: #333;
    font-weight: 600;
    flex-shrink: 0;
    max-width: 42%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mt-row-label {
    font-size: 12px;
    color: #666;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: right;
  }

  .mt-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #eee;
    font-size: 11px;
    color: #aaa;
  }
</style>

<script>
(function () {
  var DART_FILINGS_URL = "https://raw.githubusercontent.com/junggiteam/naver-news/main/data/dart_filings.json";
  var DART_MA_URL = "https://raw.githubusercontent.com/junggiteam/naver-news/main/data/dart_ma_signals.json";
  var DURATION_PER_ROW_S = 1.1; // 한 줄이 흘러가는 데 걸리는 시간(초) - 작을수록 빠름
  var VISIBLE_ROWS = 3;

  // 캐시 버스터를 요청마다 달라지는 Date.now()(ms) 대신 3시간 단위로
  // 반올림한 값으로 고정한다 - index-ticker.html과 동일한 이유(데이터가
  // DART 크롤러 주기로만 갱신되므로, 그 이상 촘촘한 무효화는 CDN 캐시
  // 히트만 방해한다).
  var CACHE_BUCKET_MS = 3 * 60 * 60 * 1000;
  function cacheBuster() { return Math.floor(Date.now() / CACHE_BUCKET_MS); }

  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  // "[기재정정]주요사항보고서(타법인주식및출자증권양수결정)" 같은 원문
  // 보고서명에서 앞의 [..] 표시와 "주요사항보고서(...)" 포장을 벗겨
  // 핵심 문구만 남긴다. 포장이 없으면(예: "회사합병결정") 그대로 둔다.
  function shortenReportName(name) {
    var s = (name || "").replace(/^\[[^\]]*\]/, "");
    var m = s.match(/주요사항보고서\(([^)]+)\)/);
    return m ? m[1] : s;
  }

  var track = document.getElementById("mt-marquee-track");
  var viewport = track.parentElement;
  var metaTextEl = document.getElementById("mt-meta-text");

  function buildRow(nameText, labelText, href) {
    var a = document.createElement("a");
    a.className = "mt-row";
    a.href = href || "#";
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    var nameEl = document.createElement("span");
    nameEl.className = "mt-row-name";
    nameEl.textContent = nameText;

    var labelEl = document.createElement("span");
    labelEl.className = "mt-row-label";
    labelEl.textContent = labelText;

    a.appendChild(nameEl);
    a.appendChild(labelEl);
    return a;
  }

  function buildFilingRow(f) {
    return buildRow(f.corp_name || "", shortenReportName(f.report_nm), f.link);
  }

  function buildMaRow(e) {
    return buildRow(e.corp_name || "", e.action || shortenReportName(e.report_nm), e.source_url);
  }

  // 항목이 보이는 줄 수(3줄)보다 많을 때만 리스트를 두 번 이어붙이고
  // 애니메이션을 켠다 - 오늘 0~2건인 카테고리 탭이 흔한데, 그럴 때 억지로
  // 무한 스크롤을 걸면 어색하다.
  function renderRows(items, buildItemFn, emptyMessage) {
    track.innerHTML = "";
    track.classList.remove("mt-scrolling");
    track.style.animationDuration = "";

    if (!items || !items.length) {
      track.innerHTML = '<p class="mt-empty">' + emptyMessage + "</p>";
      return;
    }

    if (items.length > VISIBLE_ROWS) {
      items.concat(items).forEach(function (it) { track.appendChild(buildItemFn(it)); });
      track.classList.add("mt-scrolling");
      track.style.animationDuration = (items.length * DURATION_PER_ROW_S) + "s";
    } else {
      items.forEach(function (it) { track.appendChild(buildItemFn(it)); });
    }
  }

  var filingsData = [];
  var maToday = {};
  var activeTab = "filings";

  function renderTab(key) {
    activeTab = key;
    document.querySelectorAll(".mt-tab").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-tab") === key);
    });

    if (key === "filings") {
      renderRows(filingsData, buildFilingRow, "오늘 등록된 주요 공시가 없습니다.");
    } else {
      renderRows(maToday[key] || [], buildMaRow, "오늘 발생한 공시가 없습니다.");
    }
  }

  Promise.all([
    fetch(DART_FILINGS_URL + "?t=" + cacheBuster()).then(function (res) { return res.json(); }).catch(function () { return null; }),
    fetch(DART_MA_URL + "?t=" + cacheBuster()).then(function (res) { return res.json(); }).catch(function () { return null; })
  ]).then(function (results) {
    var filingsJson = results[0];
    var maJson = results[1];

    filingsData = (filingsJson && filingsJson.filings) || [];
    maToday = (maJson && maJson[todayStr()]) || {};

    metaTextEl.textContent = (filingsJson && filingsJson.updated_at ? filingsJson.updated_at : todayStr()) + " 기준";

    document.querySelectorAll(".mt-tab").forEach(function (btn) {
      btn.addEventListener("click", function () { renderTab(btn.getAttribute("data-tab")); });
    });

    renderTab(activeTab);
  }).catch(function (err) {
    track.innerHTML = '<p class="mt-empty">데이터를 불러오지 못했습니다.</p>';
    console.error("M&A 티커 로드 실패:", err);
  });
})();
</script>
</body></html>
