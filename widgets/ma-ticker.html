<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DART 공시</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
</style>
</head>
<body>
<div id="mt-strip">
  <div class="mt-header">
    <span class="mt-label">DART 공시</span>
  </div>

  <div class="mt-marquee-viewport">
    <div class="mt-marquee-track" id="mt-marquee-track">
      <p class="mt-empty">불러오는 중...</p>
    </div>
  </div>

  <div class="mt-meta" id="mt-meta">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <span id="mt-meta-text"></span>
  </div>
</div>

<style>
  #mt-strip {
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
    padding: 14px 18px 12px;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    font-family: "Noto Sans KR", "Malgun Gothic", -apple-system, sans-serif;
    box-sizing: border-box;
    background: #fff;
  }
  #mt-strip * { box-sizing: border-box; }

  .mt-header {
    margin: -14px -18px 10px -18px;
    padding: 12px 18px;
    background: #397fe7;
    border-radius: 10px 10px 0 0;
  }
  .mt-label {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }

  /* 3줄만 보이는 창, 항목이 그보다 많을 때만 아래->위로 흐름 */
  .mt-marquee-viewport {
    height: 138px; /* 46px x 3줄 (뱃지+2줄 텍스트라 한 줄 높이가 커짐) */
    overflow: hidden;
    position: relative;
  }

  /* 항목이 3개 이하면 이 클래스가 안 붙어서 애니메이션 없이 정적으로 표시된다 */
  .mt-marquee-track.mt-scrolling {
    animation: mt-scroll-up linear infinite;
  }
  .mt-marquee-viewport:hover .mt-marquee-track.mt-scrolling {
    animation-play-state: paused;
  }

  @keyframes mt-scroll-up {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
  }

  .mt-empty { font-size: 13px; color: #aaa; padding: 8px 0; }

  /* 왼쪽 카테고리 뱃지 + 오른쪽 회사명/공시내용 2줄 */
  .mt-row {
    height: 46px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: inherit;
    text-decoration: none;
  }
  .mt-row:hover .mt-row-name { color: #142c67; }

  .mt-row-badge {
    flex: 0 0 auto;
    width: 62px;
    padding: 3px 2px;
    border-radius: 5px;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
  }
  .mt-row-badge.cat-merge { background: #8B5CF6; }
  .mt-row-badge.cat-equity { background: #3182F6; }
  .mt-row-badge.cat-swap { background: #0EA5A5; }
  .mt-row-badge.cat-control { background: #E9435C; }
  .mt-row-badge.cat-treasury { background: #F5A623; }

  .mt-row-body {
    min-width: 0;
    flex: 1 1 auto;
  }
  .mt-row-name {
    display: block;
    overflow: hidden;
    color: #222;
    font-size: 13px;
    font-weight: 700;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mt-row-desc {
    display: block;
    margin-top: 2px;
    overflow: hidden;
    color: #777;
    font-size: 11.5px;
    font-weight: 500;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mt-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #eee;
    font-size: 11px;
    color: #aaa;
  }
</style>

<script>
(function () {
  var DART_MA_URL = "https://raw.githubusercontent.com/junggiteam/naver-news/main/data/dart_ma_signals.json";
  var DURATION_PER_ROW_S = 1.1; // 한 줄이 흘러가는 데 걸리는 시간(초) - 작을수록 빠름
  var VISIBLE_ROWS = 3;

  // 캐시 버스터를 요청마다 달라지는 Date.now()(ms) 대신 1시간 단위로
  // 반올림한 값으로 고정한다 - 데이터 원본(dart_filings.json/
  // dart_ma_signals.json)이 DART 크롤러 주기(1시간, run_scheduled.py의
  // CRAWLER_INTERVALS["dart"])로만 갱신되므로, 그 이상 촘촘한 무효화는
  // CDN 캐시 히트만 방해한다. (2026-08: DART 크롤러 주기를 3시간에서
  // 1시간으로 단축하면서 이 값도 함께 조정)
  var CACHE_BUCKET_MS = 1 * 60 * 60 * 1000;
  function cacheBuster() { return Math.floor(Date.now() / CACHE_BUCKET_MS); }

  // 카테고리 순서(합치는 순서)와 뱃지 라벨/색상 클래스를 한 곳에서 관리.
  // dart_ma_signals.json의 오늘 날짜 키 안 5개 카테고리만 다룬다(일반
  // 주요사항보고 전체를 보여주는 "주요공시"는 이 위젯의 M&A 큐레이션
  // 취지에 안 맞아 제외 - 2026-08).
  var CATEGORIES = [
    { key: "합병_분할", label: "합병·분할", badgeClass: "cat-merge" },
    { key: "지분인수", label: "지분인수", badgeClass: "cat-equity" },
    { key: "주식교환_이전", label: "주식교환·이전", badgeClass: "cat-swap" },
    { key: "경영권이동_최대주주변경", label: "경영권이동", badgeClass: "cat-control" },
    { key: "자기주식", label: "자기주식", badgeClass: "cat-treasury" }
  ];

  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  // "[기재정정]주요사항보고서(타법인주식및출자증권양수결정)" 같은 원문
  // 보고서명에서 앞의 [..] 표시와 "주요사항보고서(...)" 포장을 벗겨
  // 핵심 문구만 남긴다. 포장이 없으면(예: "회사합병결정") 그대로 둔다.
  function shortenReportName(name) {
    var s = (name || "").replace(/^\[[^\]]*\]/, "");
    var m = s.match(/주요사항보고서\(([^)]+)\)/);
    return m ? m[1] : s;
  }

  // DART는 rcept_dt(접수일자)를 날짜 단위(YYYYMMDD)로만 주고 시각 정보가
  // 없어서, 오늘 하루 안에서의 "최신순"은 rcept_dt만으로는 가릴 수 없다.
  // 대신 원문 링크(link/source_url)에 박혀 있는 접수번호(rcpNo, DART가
  // 그날 접수 순서대로 매기는 일련번호, 예: 20260803000139)를 꺼내
  // 정렬 키로 쓴다 - 저장된 필드는 아니지만 URL에서 항상 뽑아낼 수 있다.
  function extractRceptNo(url) {
    var m = (url || "").match(/rcpNo=(\d+)/);
    return m ? m[1] : "";
  }

  var track = document.getElementById("mt-marquee-track");
  var metaTextEl = document.getElementById("mt-meta-text");

  function buildRow(item) {
    var a = document.createElement("a");
    a.className = "mt-row";
    a.href = item.url || "#";
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    var badge = document.createElement("span");
    badge.className = "mt-row-badge " + item.badgeClass;
    badge.textContent = item.categoryLabel;
    a.appendChild(badge);

    var body = document.createElement("span");
    body.className = "mt-row-body";

    var nameEl = document.createElement("span");
    nameEl.className = "mt-row-name";
    nameEl.textContent = item.corp_name;
    body.appendChild(nameEl);

    var descEl = document.createElement("span");
    descEl.className = "mt-row-desc";
    descEl.textContent = item.desc;
    body.appendChild(descEl);

    a.appendChild(body);
    return a;
  }

  // 항목이 보이는 줄 수(3줄)보다 많을 때만 리스트를 두 번 이어붙이고
  // 애니메이션을 켠다 - 오늘 항목이 3개 이하인 날 억지로 무한 스크롤을
  // 걸면 어색하다.
  function renderRows(items) {
    track.innerHTML = "";
    track.classList.remove("mt-scrolling");
    track.style.animationDuration = "";

    if (!items.length) {
      track.innerHTML = '<p class="mt-empty">오늘 발생한 공시가 없습니다.</p>';
      return;
    }

    if (items.length > VISIBLE_ROWS) {
      items.concat(items).forEach(function (it) { track.appendChild(buildRow(it)); });
      track.classList.add("mt-scrolling");
      track.style.animationDuration = (items.length * DURATION_PER_ROW_S) + "s";
    } else {
      items.forEach(function (it) { track.appendChild(buildRow(it)); });
    }
  }

  // 카테고리 구분 없이 오늘 접수번호(rcpNo) 기준 최신순으로 전부 섞는다.
  // (카테고리별로 묶는 대안도 실측 비교했으나, 카테고리 대부분이 하루
  // 0~2건이라 묶어도 "섹션"처럼 보이지 않고 그냥 순서만 바뀔 뿐이었다 -
  // 뱃지가 이미 각 행의 카테고리를 알려주므로, "방금 뭐가 새로 떴는지"가
  // 더 잘 보이는 시간순을 채택했다.)
  function buildTimeSortedList(maToday) {
    var list = [];
    CATEGORIES.forEach(function (cat) {
      (maToday[cat.key] || []).forEach(function (raw) {
        list.push(toRow(raw, cat));
      });
    });
    list.sort(function (a, b) { return b.rceptNo.localeCompare(a.rceptNo); });
    return list;
  }

  function toRow(raw, cat) {
    var url = raw.source_url;
    return {
      corp_name: raw.corp_name || "",
      desc: raw.action || shortenReportName(raw.report_nm),
      url: url,
      rceptNo: extractRceptNo(url) || (raw.rcept_dt || ""),
      categoryLabel: cat.label,
      badgeClass: cat.badgeClass
    };
  }

  fetch(DART_MA_URL + "?t=" + cacheBuster())
    .then(function (res) { return res.json(); })
    .then(function (maJson) {
      var maToday = (maJson && maJson[todayStr()]) || {};
      metaTextEl.textContent = todayStr() + " 기준";
      renderRows(buildTimeSortedList(maToday));
    })
    .catch(function (err) {
      track.innerHTML = '<p class="mt-empty">데이터를 불러오지 못했습니다.</p>';
      console.error("DART 공시 티커 로드 실패:", err);
    });
})();
</script>
</body></html>
